name: Publicar en redes (diario)
on:
  schedule:
    - cron: "47 13 * * *" # 10:47 hora de Argentina
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo probar (no publica)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: social-daily
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/social-post.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Guardar historial
        if: always() && !inputs.dry_run
        run: |
          git config user.name "envases3g-bot"
          git config user.email "envases3g-bot@users.noreply.github.com"
          git add marketing/posts
          git diff --cached --quiet || (git commit -m "Post diario $(date +%F) [skip ci]" && git push)
